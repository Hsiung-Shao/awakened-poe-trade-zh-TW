# 這支 workflow 只驗證「建置過得去」,**不發布任何東西**。
#
# 上游原本跑 `-p onTagOrDraft` 並帶 GH_TOKEN,推分支就可能把產物寫進草稿
# Release。本專案的發布是刻意的動作:本機打包 → 產生 SHA256SUMS →
# 建 GPG 簽章的 tag → 人工建立 Release。既然沒有 code signing,
# 少一個能寫入 Release 的自動化路徑,就少一條竄改路徑。
name: Build

# 分支叫 master 而不是 main,是因為 repo 根目錄有個 `main/` 資料夾 ——
# 兩者同名會讓 `git log main` 之類的指令回 "ambiguous argument"。上游用 master
# 應該也是同一個原因。
on:
  push:
    branches:
      - 'master'
    tags-ignore:
      - '**'
    paths-ignore:
      - 'docs/**'
      - README.md

jobs:
  renderer:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
    - run: npm ci
      working-directory: ./renderer
    - run: npm run make-index-files
      working-directory: ./renderer
    - run: npm run lint
      working-directory: ./renderer
    - run: npm run build
      working-directory: ./renderer
    - uses: actions/upload-artifact@v7
      with:
        name: renderer-dist
        path: ./renderer/dist
        retention-days: 1

  package:
    needs: renderer
    strategy:
      matrix:
        os: [windows-2022, ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
    - uses: actions/download-artifact@v8
      with:
        name: renderer-dist
        path: ./renderer/dist
    - run: npm ci
      working-directory: ./main
    - run: npm run build
      working-directory: ./main
    # `-p never`:只打包、不上傳。刻意不給 GH_TOKEN —— 沒有 token 就算
    # 設定被改回 onTagOrDraft 也寫不進 Release。
    - run: npm run package "--" -p never
      working-directory: ./main
    - name: Hash
      if: ${{ startsWith(matrix.os, 'windows') }}
      run: type .\main\dist\latest.yml
    - name: Hash
      if: ${{ startsWith(matrix.os, 'ubuntu') }}
      run: cat ./main/dist/latest-linux.yml
    - name: Hash
      if: ${{ startsWith(matrix.os, 'macos') }}
      run: cat ./main/dist/latest-mac.yml
