# 這支 workflow 只驗證「建置過得去」,**不發布任何東西**。
#
# 上游原本跑 `-p onTagOrDraft` 並帶 GH_TOKEN,推分支就可能把產物寫進草稿
# Release。本專案的發布是刻意的動作:本機打包 → 產生 SHA256SUMS →
# 建 GPG 簽章的 tag → 人工建立 Release。既然沒有 code signing,
# 少一個能寫入 Release 的自動化路徑,就少一條竄改路徑。
name: Build

# 分支叫 master 而不是 main,是因為 repo 根目錄有個 `main/` 資料夾 ——
# 兩者同名會讓 `git log main` 之類的指令回 "ambiguous argument"。上游用 master
# 應該也是同一個原因。
on:
  push:
    branches:
      - 'master'
    tags-ignore:
      - '**'
    paths-ignore:
      - 'docs/**'
      - README.md

jobs:
  renderer:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
    - run: npm ci
      working-directory: ./renderer
    - run: npm run make-index-files
      working-directory: ./renderer
    - run: npm run lint
      working-directory: ./renderer
    # 漏翻不會讓建置或型別檢查失敗 —— vue-i18n 設了 fallbackFormat + missingWarn:
    # false,少一個鍵就安靜地退回英文。這一步是唯一會擋下來的地方。
    - run: npm run verify-i18n
      working-directory: ./renderer
    - run: npm run build
      working-directory: ./renderer
    - uses: actions/upload-artifact@v7
      with:
        name: renderer-dist
        path: ./renderer/dist
        retention-days: 1

  package:
    needs: renderer
    strategy:
      matrix:
        os: [windows-2022, ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
    - uses: actions/download-artifact@v8
      with:
        name: renderer-dist
        path: ./renderer/dist
    - run: npm ci
      working-directory: ./main
    - run: npm run build
      working-directory: ./main
    # `-p never` 已經寫在 `main/package.json` 的 package script 裡,**這裡不要再傳一次**。
    # 刻意不給 GH_TOKEN,所以就算設定被改回 onTagOrDraft 也寫不進 Release。
    #
    # ⚠⚠ 傳兩次是把保護關掉,不是加倍。CLI 收到重複的 `-p` 會解析成陣列
    # `['never','never']`,而判斷是「等於字串 never」—— 不相等就走預設發布路徑,
    # 去建 GitHubPublisher,再因為沒有 token 而失敗:
    #
    #     ⨯ GitHub Personal Access Token is not set, neither programmatically,
    #       nor using env "GH_TOKEN"
    #
    # 本機實測:`npm run package` 乾淨通過,`npm run package -- -p never` 就報上面那行。
    # 這就是 3.29.902 之後 Linux 打包一直紅的原因,而擋住上傳的其實只是「沒給 token」。
    - run: npm run package
      working-directory: ./main
    - name: Hash
      if: ${{ startsWith(matrix.os, 'windows') }}
      run: type .\main\dist\latest.yml
    - name: Hash
      if: ${{ startsWith(matrix.os, 'ubuntu') }}
      run: cat ./main/dist/latest-linux.yml
    - name: Hash
      if: ${{ startsWith(matrix.os, 'macos') }}
      run: cat ./main/dist/latest-mac.yml
