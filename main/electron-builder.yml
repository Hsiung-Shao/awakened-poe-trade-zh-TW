# 必須顯式指定 owner/repo。省略的話 electron-builder 會回頭讀 package.json 的
# `repository` 欄 —— 那在本專案剛 fork 出來時仍指著上游,結果是使用者的
# 「檢查更新」會抓到上游的新版並把這個繁中版整包蓋掉。
publish:
  - provider: github
    owner: Hsiung-Shao
    repo: awakened-poe-trade-zh-TW

# ⚠ productName 與 appId 是**兩件事**,改了前者不會連帶改後者。
# appId 沒有顯式設定時,electron-builder 會用 package.json 的 name 生成
# `com.electron.awakened-poe-trade` —— 那會與官方版共用安裝目錄、登錄檔項目
# 與 %APPDATA% 設定目錄,兩個版本互相覆蓋。
productName: "Awakened PoE Trade-zh-TW"
appId: "com.hsiungshao.awakened-poe-trade-zhtw"
copyright: "Copyright © 2020 Alexander Drozdov. Traditional Chinese build by Hsiung-Shao."
npmRebuild: false
toolsets:
  appimage: 1.0.3
artifactBuildCompleted: "build/apprun-patch.test.mjs"
files:
  - "package.json"
  - from: "dist"
    to: "."
    filter: ["main.js", "vision.js"]
  - from: "../renderer/dist"
    to: "."

# ⚠ MIT 的條件是「著作權聲明**與授權聲明**必須包含在所有副本或重要部分中」。
# 上面的 `copyright:` 只會寫進 Windows exe 的 VERSIONINFO,那是**著作權聲明**,
# 不是授權聲明全文 —— 兩者不能互相取代。
#
# 實測 3.29.904 的安裝目錄:只有 LICENSE.electron.txt、LICENSES.chromium.html
# (electron-builder 自己放的)與兩個 npm 相依的 LICENSE,**本程式自己的 MIT
# 授權全文從來沒有隨產物出貨過**。這裡把上游的 LICENSE 原樣放到 exe 旁邊,
# 與 Electron 的授權檔同一個位置。
#
# 用 extraFiles 而不是 files:後者會把它塞進 app.asar 壓縮檔,使用者打不開。
extraFiles:
  - from: "../LICENSE"
    to: "LICENSE.txt"
extraMetadata:
  main: "main.js"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
win:
  target:
  - "nsis"
  - "portable"
linux:
  target:
  - "AppImage"
mac:
  target:
  - target: "dmg"
    arch:
    - "universal"
  identity: null
  x64ArchFiles: "*"
